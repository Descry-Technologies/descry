name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package, without the leading v"
        required: false

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target_name: x86_64-unknown-linux-gnu
          - name: macos-arm64
            os: macos-latest
            target_name: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target
        run: rustup target add "${{ matrix.target_name }}"

      - name: Check package version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          PACKAGE_VERSION="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; data = json.load(sys.stdin); print(next(package["version"] for package in data["packages"] if package["name"] == "descry-cli"))')"
          if [ "$PACKAGE_VERSION" != "$VERSION" ]; then
            echo "package version $PACKAGE_VERSION does not match release version $VERSION" >&2
            exit 1
          fi

      - name: Package
        env:
          DESCRY_PACKAGE_TARGET: ${{ matrix.target_name }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          sh scripts/package.sh "$VERSION"

      - name: Smoke packaged binary
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          mkdir -p /tmp/descry-release-smoke
          tar -xzf "dist/descry-$VERSION-${{ matrix.target_name }}.tar.gz" -C /tmp/descry-release-smoke
          "/tmp/descry-release-smoke/descry-$VERSION-${{ matrix.target_name }}/descry" --version

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: descry-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/SHA256SUMS

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate Homebrew formula
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sh scripts/homebrew_formula.sh "$VERSION"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/descry.rb
